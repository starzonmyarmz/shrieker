  :root {
    --enamel: #f2c200;
    --enamel-hi: #ffd83a;
    --enamel-lo: #d9a900;
    --ink: #161412;
    --cream: #f4eee0;
    --cream-lo: #e2d8bf;
    --red: #c8261e;
    --bakelite: #1c1a18;
    --bakelite-hi: #34302c;
    --brass: #b8893a;
    --brass-hi: #f0d28a;
    --arc: #bfe6ff;
    --lamp: #ff3b1f;
    --chrome: #c9ced4;
    --chrome-lo: #7d848c;
    --stripe: 14px;
    --gap: 14px;
    --knob: 52px;
    --cell: 84px;
    --label: 15px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    block-size: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  body {
    background: var(--ink);
    color: var(--ink);
    font-family: "League Gothic", sans-serif;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
  }

  :focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 3px;
  }

  .pedal {
    inline-size: 640px;
    block-size: 460px;
    border: var(--stripe) solid transparent;
    border-radius: 22px;
    background:
      radial-gradient(circle at 1px 1px, #fff2 1px, transparent 1.5px) padding-box,
      radial-gradient(120% 90% at 30% 15%, var(--enamel-hi), var(--enamel) 55%, var(--enamel-lo)) padding-box,
      repeating-linear-gradient(-45deg, var(--ink) 0 var(--stripe), var(--enamel) var(--stripe) calc(var(--stripe) * 2)) border-box;
    background-size: 4px 4px, auto, auto;
    box-shadow: inset 0 2px 0 #fff6, inset 0 -3px 8px #0005;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto 1fr;
    gap: var(--gap);
    padding: 16px 18px;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .badge {
    display: grid;
    place-items: center;
    inline-size: 250px;
    block-size: 84px;
    margin-inline-start: 6px;
    border-radius: 50%;
    background: radial-gradient(80% 70% at 40% 30%, #2c2925, var(--ink));
    box-shadow: 0 0 0 3px var(--enamel), 0 0 0 5px var(--ink), 0 4px 8px #0006;

    & svg {
      inline-size: 210px;
      overflow: visible;
    }
  }

  .electrodes {
    --charge: 0;
    position: relative;
    inline-size: 300px;
    block-size: 100px;

    &::before {
      content: "";
      position: absolute;
      inset-block-start: 6px;
      inset-inline: 12px;
      block-size: 40px;
      border-radius: 20px;
      background: radial-gradient(60% 50% at 50% 50%, #2a3440, var(--ink));
      box-shadow: inset 0 3px 6px #000, 0 1px 0 #fff6;
    }

    &::after {
      content: "";
      position: absolute;
      inset-block-start: 6px;
      inset-inline: 12px;
      block-size: 40px;
      border-radius: 20px;
      background: radial-gradient(50% 60% at 50% 50%, #bfe6ff66, transparent);
      opacity: var(--charge);
    }
  }

  .post {
    position: absolute;
    z-index: 1;
    inset-block-start: 3px;
    inline-size: 46px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, var(--bakelite-hi), var(--bakelite) 70%);
    box-shadow: 0 3px 5px #0007, inset 0 1px 0 #fff3;
    transition: filter 300ms;

    &::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff8e0, var(--brass-hi) 18%, var(--brass) 55%, #5e4317);
      box-shadow: 0 2px 3px #0008;
    }

    &.left { inset-inline-start: 0; }
    &.right { inset-inline-end: 0; }
  }

  .arcs {
    position: absolute;
    inset: 0;
    inline-size: 300px;
    block-size: 60px;
    overflow: visible;
    pointer-events: none;
    opacity: var(--charge);
  }

  .electrodes.off .post { filter: saturate(0.5) brightness(0.8); }

  .danger {
    position: absolute;
    inset-block-end: 2px;
    inset-inline-start: 50%;
    translate: -50% 0;
    display: grid;
    justify-items: center;
    gap: 1px;
    padding: 4px 14px 3px;
    border-radius: 5px;
    background: linear-gradient(#fbf7ec, var(--cream) 60%, var(--cream-lo));
    box-shadow: inset 0 1px 0 #fff, 0 2px 0 #0003, 0 3px 6px #0004;

    & .pill {
      padding: 0 10px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: var(--red);
      color: var(--cream);
      font-size: 13px;
      line-height: 1.15;
      letter-spacing: 0.12em;
    }

    & .hv {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--red);
    }
  }

  .presets {
    justify-self: center;
    display: flex;
    gap: 5px;
    padding: 5px;
    border-radius: 7px;
    background: var(--ink);
    box-shadow: inset 0 2px 4px #000, 0 1px 0 #fff5;

    & button {
      padding: 3px 7px 4px;
      border-radius: 3px 3px 6px 6px;
      background: linear-gradient(#fbf6e8, var(--cream-lo));
      box-shadow: 0 3px 0 #9c8f6c, 0 4px 4px #0006;
      font-size: 13px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: translate 60ms, box-shadow 60ms;

      &:active, &[aria-pressed="true"] {
        translate: 0 2px;
        box-shadow: 0 1px 0 #9c8f6c, 0 1px 2px #0006;
      }

      &[aria-pressed="true"] {
        background: linear-gradient(#fff4d6, #f1dca0);
        color: var(--red);
      }
    }
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(5, var(--cell)) 1fr;
    grid-template-rows: 1fr 1fr;
    align-items: center;
    justify-items: center;
  }

  .control {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 7px;
  }

  .name {
    font-size: var(--label);
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
  }

  .dial {
    position: relative;
    inline-size: var(--knob);
    aspect-ratio: 1;

    &::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 4px 6px #0008, 0 1px 1px #0009;
    }
  }

  .tick {
    position: absolute;
    inset: -7px;
    rotate: calc(var(--at) * 270deg - 135deg);
    pointer-events: none;

    &::before {
      content: "";
      position: absolute;
      inset-inline-start: calc(50% - 1px);
      inline-size: 2px;
      block-size: 4px;
      border-radius: 1px;
      background: var(--ink);
    }
  }

  .cap {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle, var(--bakelite) 0 60%, transparent 62%),
      repeating-conic-gradient(var(--bakelite) 0 7deg, var(--bakelite-hi) 7deg 14deg);
    rotate: calc(var(--turn) * 270deg - 135deg);
    touch-action: none;
    cursor: ns-resize;

    &::after {
      content: "";
      position: absolute;
      inset-inline-start: calc(50% - 1.5px);
      inset-block-start: 10%;
      inline-size: 3px;
      block-size: 34%;
      border-radius: 1.5px;
      background: var(--cream);
    }

    &:focus-visible { outline-offset: 5px; }
  }

  .shine {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #fff4, transparent 45%);
    pointer-events: none;
  }

  .readout {
    position: absolute;
    inset-block-end: calc(100% + 4px);
    inset-inline-start: 50%;
    translate: -50% 0;
    padding: 1px 7px 2px;
    border-radius: 3px;
    background: var(--ink);
    color: var(--cream);
    font-size: 13px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 120ms;
  }

  .control:hover .readout, .control:focus-within .readout, .control.dragging .readout { opacity: 1; }

  .stomp {
    grid-column: 6;
    grid-row: 1 / span 2;
    display: grid;
    justify-items: center;
    gap: 22px;
  }

  .lamp {
    inline-size: 26px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #8a3a2c, #4a120a 60%, #250604);
    box-shadow: 0 0 0 3px var(--chrome), 0 0 0 4px #555, 0 3px 4px 4px #0004;
    transition: background 200ms, box-shadow 200ms;

    &.on {
      background: radial-gradient(circle at 40% 35%, #ffd8c8, var(--lamp) 40%, #8a1206 85%);
      box-shadow: 0 0 0 3px var(--chrome), 0 0 0 4px #555, 0 0 16px 6px #ff3b1f88;
    }
  }

  .footswitch {
    inline-size: 58px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff, var(--chrome) 30%, var(--chrome-lo) 70%, #4b5157);
    box-shadow: 0 0 0 5px #9aa1a8, 0 0 0 7px #3a3d40, 0 6px 9px 6px #0006;
    cursor: pointer;
    transition: translate 60ms, box-shadow 60ms;

    &:active {
      translate: 0 2px;
      box-shadow: 0 0 0 5px #9aa1a8, 0 0 0 7px #3a3d40, 0 3px 5px 6px #0006;
    }
  }

  .serial {
    grid-column: 5;
    grid-row: 2;
    display: grid;
    justify-items: center;
    padding: 4px 8px;
    border-radius: 2px;
    background: linear-gradient(135deg, #e9ecef, #aab1b8 45%, #eef1f3 55%, #9aa1a8);
    box-shadow: 0 1px 2px #0005;
    rotate: -4deg;
    translate: 12px 14px;
    font-size: 11px;
    line-height: 1.1;
    letter-spacing: 0.06em;

    & small {
      font-size: 8px;
      letter-spacing: 0.2em;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lamp, .post { transition: none; }
  }
</style>
</head>
<body>
<main class="pedal">
  <header class="top">
    <div class="badge">
      <svg viewBox="-10 -4 266 64" role="img" aria-label="Shrieker">
        <g transform="skewX(-14)" fill="#f4eee0">
          <path d="M6 0H30V10H14L28 20L30 22V32L22 40H0V30H17L2 19L0 16V7Z"/>
          <path transform="translate(34)" d="M0 0H10V15H20V0H30V40H20V25H10V40H0Z"/>
          <path transform="translate(68)" fill-rule="evenodd" d="M0 0H24L30 6V18L25 23L30 40H19L15 25H10V40H0ZM10 9V16H20V9Z"/>
          <path transform="translate(102)" d="M0 0H10V40H0Z"/>
          <path transform="translate(116)" d="M0 0H26V9H10V15.5H22V24.5H10V31H26V40H0Z"/>
          <path transform="translate(146)" d="M0 0H10V15L19 0H31L19 20L31 40H19L10 25V40H0Z"/>
          <path transform="translate(181)" d="M0 0H26V9H10V15.5H22V24.5H10V31H26V40H0Z"/>
          <path transform="translate(211)" fill-rule="evenodd" d="M0 0H24L30 6V18L25 23L30 40H19L15 25H10V40H0ZM10 9V16H20V9Z"/>
        </g>
        <path d="M-4 45H136L126 51H252L240 58H118L128 52H-9Z" fill="#c8261e"/>
      </svg>
    </div>
    <div class="electrodes" id="electrodes">
      <div class="post left"></div>
      <div class="post right"></div>
      <svg class="arcs" viewBox="0 0 300 60" aria-hidden="true">
        <defs>
          <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
        </defs>
        <g id="arcs"></g>
      </svg>
      <div class="danger"><span class="pill">DANGER</span><span class="hv">HIGH VOLTAGE</span></div>
    </div>
  </header>
  <nav class="presets" id="presets" aria-label="Presets"></nav>
  <section class="controls">
    <div data-slot="bloom"></div>
    <div data-slot="pitch"></div>
    <div data-slot="squabble"></div>
    <div data-slot="chirp"></div>
    <div data-slot="mess"></div>
    <div data-slot="drive"></div>
    <div data-slot="tone"></div>
    <div data-slot="choke"></div>
    <div data-slot="level"></div>
    <div class="serial"><small>SER. NO.</small><span id="version"></span></div>
    <div class="stomp"><span class="lamp" id="lamp"></span><div data-slot="stomp"></div></div>
  </section>
</main>

<script>
(() => {
  const params = new Map();
  const views = new Map();
  const dragging = new Set();
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  const bridge = window.ipc
    ? (msg) => window.ipc.postMessage(JSON.stringify(msg))
    : mockBridge();

  function setParam(id, value) {
    const p = params.get(id);
    if (!p) return;
    p.value = Math.min(1, Math.max(0, value));
    bridge({ type: "set", id, value: p.value });
    views.get(id)?.(p);
    showPreset();
    art();
  }

  function gesture(id, fn) {
    bridge({ type: "begin", id });
    fn();
    bridge({ type: "end", id });
  }

  // ---------- presets ----------

  let presets = [];
  const presetButtons = [];

  function buildPresets() {
    const buttons = presets.map((preset) => {
      const button = document.createElement("button");
      button.textContent = preset.name;
      button.addEventListener("click", () => {
        for (const [id, value] of Object.entries(preset.values)) gesture(id, () => setParam(id, value));
      });
      return button;
    });
    presetButtons.splice(0, Infinity, ...buttons);
    document.getElementById("presets").replaceChildren(...buttons);
    showPreset();
  }

  function showPreset() {
    presets.forEach((preset, i) => {
      const on = Object.entries(preset.values).every(([id, value]) => Math.abs((params.get(id)?.value ?? -1) - value) < 1e-3);
      presetButtons[i]?.setAttribute("aria-pressed", String(on));
    });
  }

  // ---------- controls ----------

  function buildKnob(p) {
    const id = p.id;
    const el = document.createElement("div");
    el.className = "control";
    const dial = document.createElement("div");
    dial.className = "dial";
    const stepped = p.steps > 0;
    const ticks = stepped ? p.steps : 10;
    for (let i = 0; i <= ticks; i++) {
      const tick = document.createElement("span");
      tick.className = "tick";
      tick.style.setProperty("--at", (i / ticks).toFixed(4));
      dial.append(tick);
    }
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.tabIndex = 0;
    cap.setAttribute("role", "slider");
    cap.setAttribute("aria-label", p.name);
    cap.setAttribute("aria-valuemin", "0");
    cap.setAttribute("aria-valuemax", "1");
    const shine = document.createElement("div");
    shine.className = "shine";
    const readout = document.createElement("span");
    readout.className = "readout";
    dial.append(cap, shine, readout);
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = p.name;
    el.append(dial, name);

    views.set(id, (p) => {
      cap.style.setProperty("--turn", p.value.toFixed(4));
      cap.setAttribute("aria-valuenow", p.value.toFixed(4));
      cap.setAttribute("aria-valuetext", p.text);
      readout.textContent = p.text;
    });

    const snap = (v) => stepped ? Math.round(v * p.steps) / p.steps : v;
    const stepSize = stepped ? 1 / p.steps : 0.01;

    cap.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      cap.setPointerCapture(e.pointerId);
      cap.focus();
      dragging.add(id);
      el.classList.add("dragging");
      bridge({ type: "begin", id });
      let raw = p.value;
      let lastY = e.clientY;
      const move = (ev) => {
        const fine = ev.shiftKey ? 0.15 : 1;
        raw = Math.min(1, Math.max(0, raw + ((lastY - ev.clientY) / 200) * fine));
        lastY = ev.clientY;
        const next = snap(raw);
        if (next !== p.value) setParam(id, next);
      };
      const up = () => {
        cap.removeEventListener("pointermove", move);
        cap.removeEventListener("pointerup", up);
        cap.removeEventListener("pointercancel", up);
        dragging.delete(id);
        el.classList.remove("dragging");
        bridge({ type: "end", id });
      };
      cap.addEventListener("pointermove", move);
      cap.addEventListener("pointerup", up);
      cap.addEventListener("pointercancel", up);
    });

    cap.addEventListener("dblclick", () => gesture(id, () => setParam(id, p.default)));

    cap.addEventListener("keydown", (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir === undefined) return;
      e.preventDefault();
      e.stopPropagation();
      const amount = stepped ? stepSize : stepSize * (e.shiftKey ? 10 : 1);
      gesture(id, () => setParam(id, snap(p.value + dir * amount)));
    });

    cap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const dir = Math.sign(-e.deltaY);
      if (!dir) return;
      gesture(id, () => setParam(id, snap(p.value + dir * (stepped ? stepSize : stepSize / 2))));
    }, { passive: false });

    return el;
  }

  function buildFootswitch(p) {
    const id = p.id;
    const button = document.createElement("button");
    button.className = "footswitch";
    button.setAttribute("role", "switch");
    button.setAttribute("aria-label", p.name);
    const lamp = document.getElementById("lamp");
    views.set(id, (p) => {
      const on = p.value >= 0.5;
      button.setAttribute("aria-checked", String(on));
      lamp.classList.toggle("on", on);
    });
    button.addEventListener("click", () => gesture(id, () => setParam(id, p.value >= 0.5 ? 0 : 1)));
    return button;
  }

  function build() {
    for (const slot of document.querySelectorAll("[data-slot]")) {
      const p = params.get(slot.dataset.slot);
      if (!p) continue;
      slot.replaceChildren(p.id === "stomp" ? buildFootswitch(p) : buildKnob(p));
    }
    for (const p of params.values()) views.get(p.id)?.(p);
  }

  // ---------- arc art ----------

  // The spark's strength is the feedback's real output level, from the
  // plugin's meter feed. Knobs shape it: Mess makes it jagged and forked,
  // Squabble adds arcs, Chirp sets how fast it flickers.
  const arcGroup = document.getElementById("arcs");
  const electrodes = document.getElementById("electrodes");
  const value = (id, fallback) => params.get(id)?.value ?? fallback;

  function bolt(x1, y1, x2, y2, depth, amp) {
    let pts = [[x1, y1], [x2, y2]];
    for (let d = 0; d < depth; d++) {
      const next = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1];
        const [bx, by] = pts[i];
        const len = Math.hypot(bx - ax, by - ay) || 1;
        const off = (Math.random() * 2 - 1) * amp;
        next.push([(ax + bx) / 2 - ((by - ay) / len) * off, (ay + by) / 2 + ((bx - ax) / len) * off], pts[i]);
      }
      pts = next;
      amp *= 0.55;
    }
    return pts;
  }

  function polyline(pts, width, color, opacity, filter) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    line.setAttribute("points", pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "));
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", color);
    line.setAttribute("stroke-width", width);
    line.setAttribute("stroke-linejoin", "round");
    line.setAttribute("stroke-linecap", "round");
    line.setAttribute("opacity", opacity.toFixed(2));
    if (filter) line.setAttribute("filter", filter);
    return line;
  }

  function spark(pts, strength) {
    return [
      polyline(pts, 10 * strength, "#bfe6ff", 1, "url(#blur)"),
      polyline(pts, 3.4 * strength, "#bfe6ff", 1),
      polyline(pts, 1.6 * strength, "#ffffff", 1),
    ];
  }

  function drawArcs() {
    const mess = value("mess", 0.2);
    const squabble = value("squabble", 0.25);
    const depth = 3 + Math.round(mess * 2);
    const amp = 3 + mess * 16;
    const count = 1 + (squabble > 0.3) + (squabble > 0.7);
    const nodes = [];
    for (let a = 0; a < count; a++) {
      const lift = a === 0 ? 0 : (a === 1 ? -9 : 9);
      const main = bolt(40, 26 + lift * 0.6, 260, 26 - lift * 0.6, depth, amp + a * 4);
      const strength = a === 0 ? 1 : 0.7;
      nodes.push(...spark(main, strength));
      const forks = Math.round(mess * 3 * strength);
      for (let f = 0; f < forks; f++) {
        const [sx, sy] = main[1 + Math.floor(Math.random() * (main.length - 2))];
        const angle = (Math.random() * 2 - 1) * 1.1 + (Math.random() < 0.5 ? 0 : Math.PI);
        const reach = 14 + Math.random() * 22;
        const end = [sx + Math.cos(angle) * reach, sy + Math.sin(angle) * reach * 0.8];
        nodes.push(...spark(bolt(sx, sy, end[0], end[1], 2, 5), 0.55));
      }
    }
    arcGroup.replaceChildren(...nodes);
    electrodes.classList.toggle("off", value("stomp", 1) < 0.5);
  }

  let charge = 0;
  let chargeTarget = 0;
  let chargeFrame = 0;
  let chargeTime = 0;

  function meter(level) {
    const target = Math.min(1, Math.sqrt(level) * 1.4);
    if (charge < 0.02 && target >= 0.02) art();
    chargeTarget = target;
    if (!chargeFrame) chargeFrame = requestAnimationFrame(glowStep);
  }

  function glowStep(now) {
    const dt = chargeTime ? Math.min(0.1, (now - chargeTime) / 1000) : 0;
    chargeTime = now;
    charge = chargeTarget > charge ? chargeTarget : Math.max(chargeTarget, charge - dt * 4);
    electrodes.style.setProperty("--charge", charge.toFixed(2));
    if (charge === chargeTarget) {
      chargeFrame = 0;
      chargeTime = 0;
      return;
    }
    chargeFrame = requestAnimationFrame(glowStep);
  }

  let flicker = 0;
  let frame = 0;

  function art() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(drawArcs);
  }

  function scheduleFlicker() {
    clearTimeout(flicker);
    if (reduceMotion.matches || !params.size) return;
    const chirp = value("chirp", 0.25);
    flicker = setTimeout(() => {
      if (charge >= 0.02) drawArcs();
      scheduleFlicker();
    }, 900 - 850 * chirp);
  }

  reduceMotion.addEventListener("change", scheduleFlicker);

  // ---------- messages ----------

  addEventListener("pointerdown", () => bridge({ type: "focus" }), true);
  addEventListener("focusin", () => bridge({ type: "keys", active: true }));
  addEventListener("focusout", (e) => {
    if (!e.relatedTarget) bridge({ type: "keys", active: false });
  });

  function forwardKey(msg) {
    const { event, type, ...init } = msg;
    const target = document.activeElement ?? document.body;
    target.dispatchEvent(new KeyboardEvent(event, { ...init, bubbles: true, cancelable: true }));
  }

  window.onPluginMessage = (msg) => {
    switch (msg.type) {
      case "key": return forwardKey(msg);
      case "meter": return meter(msg.level);
      case "init":
        document.getElementById("version").textContent = `v${msg.version}`;
        params.clear();
        msg.params.forEach((p) => params.set(p.id, { ...p, value: p.default, text: "" }));
        presets = msg.presets ?? [];
        build();
        buildPresets();
        art();
        scheduleFlicker();
        return;
      case "values":
        for (const { id, value, text } of msg.values) {
          const p = params.get(id);
          if (!p) continue;
          p.text = text;
          if (!dragging.has(id)) p.value = value;
          views.get(id)?.(p);
        }
        showPreset();
        art();
        return;
    }
  };

  // ---------- browser mock ----------

  // Stands in for the plugin in a browser, with the parameters and text
  // from mock.json, which the tests write from the plugin's params.
  function mockBridge() {
    const version = new URLSearchParams(location.search).get("version") ?? "0.0.0";
    const mock = fetch("mock.json").then((r) => r.json());
    const specs = mock.then((mock) => new Map(mock.params.map((p) => [p.id, p])));
    const values = {};
    const send = (msg) => setTimeout(() => window.onPluginMessage(msg));
    const text = (p, n) => p.texts[Math.round(n * (p.texts.length - 1))];
    const sendValues = (specs, ids) => send({
      type: "values",
      values: ids.map((id) => ({ id, value: values[id], text: text(specs.get(id), values[id]) })),
    });
    return (msg) => Promise.all([specs, mock]).then(([specs, mock]) => {
      switch (msg.type) {
        case "ready":
          for (const p of specs.values()) values[p.id] ??= p.default;
          send({ type: "init", version, params: [...specs.values()].map(({ texts, ...rest }) => rest), presets: mock.presets });
          sendValues(specs, [...specs.keys()]);
          send({ type: "meter", level: 0.4 });
          return;
        case "set":
          values[msg.id] = msg.value;
          sendValues(specs, [msg.id]);
          return;
      }
    });
  }

  bridge({ type: "ready" });
})();
</script>
</body>
</html>
